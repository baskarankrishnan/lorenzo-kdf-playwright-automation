name: CI Build Check
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-check:
    # Compile/load check ONLY. The Playwright tests target an internal Dedalus
    # LORENZO environment (WS008416.dedalus.lan + national SSO) that GitHub cloud
    # runners cannot reach, so the live tests are intentionally NOT executed here.
    # The Node project lives in the lorenzo-playwright-kdf/ subfolder, so all
    # commands run from there.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lorenzo-playwright-kdf
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      # --ignore-scripts skips native postinstall builds (e.g. the deasync addon)
      # that fail on Linux CI and are NOT needed for a compile/load check.
      run: npm ci --ignore-scripts
    - name: Compile & load all Playwright specs (no execution)
      run: npx playwright test --list
